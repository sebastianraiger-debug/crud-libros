<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Acceso - Guardia Civil</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-image: url('/images/escudoguardiacivil.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 10px;
        }
    </style>
</head>
<body>

<div class="container" style="max-width: 400px;">
    <div class="card shadow-lg">
        <div class="card-body p-4">

            <!-- Logo y título -->
            <div class="text-center mb-4">
                <img src="/images/escudoguardiacivil.png" style="height: 80px;">
                <h4 class="mt-2 fw-bold">Guardia Civil</h4>
                <p class="text-muted">Biblioteca de Formación</p>
            </div>

            <!-- Mensaje de error -->
            <div th:if="${param.error}" class="alert alert-danger">
                Usuario o contraseña incorrectos
            </div>

            <!-- Mensaje de logout -->
            <div th:if="${param.logout}" class="alert alert-success">
                Sesión cerrada correctamente ✅
            </div>

            <!-- Formulario -->
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-bold">Usuario</label>
                    <input type="text" name="username" class="form-control"
                           placeholder="Introduce tu usuario" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Contraseña</label>
                    <input type="password" name="password" class="form-control"
                           placeholder="Introduce tu contraseña" required>
                </div>
                <button type="submit" class="btn w-100 text-white fw-bold"
                        style="background-color: #1a5c1a;">
                    🔐 Acceder
                </button>
            </form>

        </div>
    </div>
</div>

</body>
</html>
