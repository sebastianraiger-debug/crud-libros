<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ver Libro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-image: url('/images/escudoguardiacivil.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.92);
            border-radius: 10px;
            padding: 20px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark mb-4" style="background-color: #1a5c1a;">
    <div class="container-fluid px-4">
        <div class="d-flex align-items-center gap-3">
            <img src="/images/escudoguardiacivil.png"
                 style="height: 50px; width: 50px; object-fit: contain;">
            <div>
                <span class="navbar-brand mb-0 fw-bold fs-5">Guardia Civil</span>
                <br>
                <small class="text-white-50">Biblioteca de Formación</small>
            </div>
        </div>
        <span class="text-white-50 small">Sistema de Gestión de Libros</span>
    </div>
</nav>

<div class="container mt-4" style="max-width: 700px;">
    <div class="card shadow-sm">
        <div class="card-header text-white d-flex justify-content-between align-items-center"
             style="background-color: #1a5c1a;">
            <h4 th:text="${libro.nombrelibro}" class="mb-0"></h4>
            <span class="badge bg-warning text-dark" th:text="${libro.autor}"></span>
        </div>
        <div class="card-body">

            <div class="row mb-3">
                <div class="col-md-6">
                    <p><strong>Título:</strong> <span th:text="${libro.titulo}"></span></p>
                </div>
                <div class="col-md-6">
                    <p><strong>Características:</strong> <span th:text="${libro.caracteristicas}"></span></p>
                </div>
            </div>

            <div class="mb-3">
                <h5 class="border-bottom pb-2">Prefacio</h5>
                <p th:text="${libro.prefacio}" class="text-muted"></p>
            </div>

            <div class="mb-3">
                <h5 class="border-bottom pb-2">Contenido</h5>
                <p th:text="${libro.contenido}" class="text-muted"></p>
            </div>

            <div class="mb-3">
                <h5 class="border-bottom pb-2">Capítulos</h5>
                <pre th:text="${libro.capitulos}" class="bg-light p-3 rounded"></pre>
            </div>

        </div>
        <div class="card-footer d-flex gap-2">
            <a th:href="@{|/libros/editar/${libro.id}|}" class="btn text-white fw-bold"
               style="background-color: #1a5c1a;">✏️ Editar</a>
            <a th:href="@{/libros}" class="btn btn-secondary">← Volver</a>
        </div>
    </div>
</div>

</body>
</html>
