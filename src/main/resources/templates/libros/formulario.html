<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Libro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-image: url('/images/escudoguardiacivil.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark mb-4" style="background-color: #1a5c1a;">
    <div class="container-fluid px-4">
        <div class="d-flex align-items-center gap-3">
            <img src="/images/escudoguardiacivil.png"
                 style="height: 50px; width: 50px; object-fit: contain;">
            <div>
                <span class="navbar-brand mb-0 fw-bold fs-5">Guardia Civil</span>
                <br>
                <small class="text-white-50">Biblioteca de Formación</small>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-4" style="max-width: 700px;">
    <div class="card shadow-sm">
        <div class="card-header text-white" style="background-color: #1a5c1a;">
            <h4 th:text="${libro.id == null ? 'Nuevo Libro' : 'Editar Libro'}" class="mb-0"></h4>
        </div>
        <div class="card-body">
            <!-- Portada del libro -->
            <div th:if="${libro.rutaPortada}" class="text-center mb-4">
                <img th:src="${libro.rutaPortada}"
                     style="max-height: 300px; max-width: 100%;"
                     class="rounded shadow">
            </div>
            <form th:action="@{/libros}" th:object="${libro}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:field="*{id}"/>

                <div class="mb-3">
                    <label class="form-label fw-bold">Nombre del libro *</label>
                    <input type="text" class="form-control"
                           th:field="*{nombrelibro}"
                           th:classappend="${#fields.hasErrors('nombrelibro')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{nombrelibro}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Autor *</label>
                    <input type="text" class="form-control"
                           th:field="*{autor}"
                           th:classappend="${#fields.hasErrors('autor')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{autor}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Título</label>
                    <textarea class="form-control" th:field="*{titulo}" rows="2"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Capítulos</label>
                    <textarea class="form-control" th:field="*{capitulos}" rows="3"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Contenido</label>
                    <textarea class="form-control" th:field="*{contenido}" rows="3"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Características</label>
                    <input type="text" class="form-control" th:field="*{caracteristicas}">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Portada del libro</label>
                    <input type="file" class="form-control" name="archivoPortada" accept="image/*">
                    <small class="text-muted">Formatos: JPG, PNG, GIF</small>
                    <!-- Muestra la portada actual si existe -->
                    <div th:if="${libro.rutaPortada}" class="mt-2">
                        <img th:src="${libro.rutaPortada}" style="max-height: 150px;" class="rounded shadow-sm">
                        <p class="text-muted small mt-1">Portada actual — sube una nueva para cambiarla</p>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Prefacio</label>
                    <textarea class="form-control" th:field="*{prefacio}" rows="3"></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn text-white fw-bold"
                            style="background-color: #1a5c1a;">💾 Guardar</button>
                    <a th:href="@{/libros}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
