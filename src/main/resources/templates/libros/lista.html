<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mi Biblioteca</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<style>
    body {
        background-image: url('/images/escudoguardiacivil.png');
        background-repeat: no-repeat;
        background-position: center center;
        background-size: cover;
        background-attachment: fixed;
        min-height: 100vh;
    }

    .container {
        background-color: rgba(255, 255, 255, 0.92);
        border-radius: 10px;
        padding: 20px;
    }
</style>
<body class="bg-light">
<nav class="navbar navbar-dark mb-4" style="background-color: #1a5c1a;">
    <div class="container-fluid px-4">
        <div class="d-flex align-items-center gap-3">
            <img src="/images/escudoguardiacivil.png"
                 style="height: 50px; width: 50px; object-fit: contain;">
            <div>
                <span class="navbar-brand mb-0 fw-bold fs-5">Guardia Civil</span>
                <br>
                <small class="text-white-50">Biblioteca de Formación</small>
            </div>
        </div>
        <span class="text-white-50 small">Sistema de Gestión de Libros</span>
    </div>
</nav>
<!-- Mensaje de éxito -->
<div class="container mt-2">
    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
        <strong>✅</strong> <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3">📚 Mi Biblioteca Personal</h1>
        <form th:action="@{/libros}" method="get" class="d-flex gap-2">
            <input type="text" name="buscar" class="form-control"
                   placeholder="Buscar por nombre..."
                   th:value="${buscar}">
            <button type="submit" class="btn btn-outline-light">🔍 Buscar</button>
            <a th:href="@{/libros}" class="btn btn-outline-light">✖ Limpiar</a>
        </form>
        <a th:href="@{/libros/nuevo}" class="btn btn-primary">+ Nuevo libro</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Título</th>
                    <th>Autor</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="libro : ${libros}">
                    <td th:text="${libro.id}"></td>
                    <td th:text="${libro.nombrelibro}"></td>
                    <td th:text="${libro.titulo}"></td>
                    <td th:text="${libro.autor}"></td>
                    <td>
                        <a th:href="@{|/libros/ver/${libro.id}|}" class="btn btn-sm btn-info">Ver</a>
                        <a th:href="@{|/libros/editar/${libro.id}|}" class="btn btn-sm btn-warning">Editar</a>
                        <a th:href="@{|/libros/eliminar/${libro.id}|}" class="btn btn-sm btn-danger"
                           onclick="return confirm('¿Eliminar este libro?')">Eliminar</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
